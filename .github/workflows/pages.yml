name: GitHub Pages

on:
  pull_request:
    paths: ['site/**', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
        shell: bash
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    env:
      NEXT_PUBLIC_BASE_PATH: /lnpctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and check static site
        run: |
          set -euo pipefail
          npm run build
          node scripts/check-static.mjs
      - name: Identify this build artifact
        id: artifact
        run: |
          set -euo pipefail
          echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist/client
          name: ${{ steps.artifact.outputs.name }}

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
